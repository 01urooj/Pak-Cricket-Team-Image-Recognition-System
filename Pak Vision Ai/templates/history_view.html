<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scan Details | PakVision AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #031f18;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back {
            color: #00ff99;
            text-decoration: none;
        }

        .card {
            background: #0b3328;
            border: 1px solid #087a58;
            border-radius: 15px;
            padding: 30px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .item {
            background: #06281f;
            padding: 18px;
            border-radius: 10px;
        }

        .item strong {
            display: block;
            color: #00ff99;
            margin-bottom: 8px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #00ff99;
            color: #00251a;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="topbar">

        <h1>Scan Details</h1>

        <a href="/history" class="back">
            <i class="fa-solid fa-arrow-left"></i>
            Back To History
        </a>

    </div>


    <div class="card">

        <div class="info">

            <div class="item">
                <strong>ID</strong>
                {{ record["id"] }}
            </div>

            <div class="item">
                <strong>Player</strong>
                {{ record["player_name"] }}
            </div>

            <div class="item">
                <strong>Role</strong>
                {{ record["role"] }}
            </div>

            <div class="item">
                <strong>Accuracy</strong>
                {{ record["accuracy"] }}
            </div>

            

            

            <div class="item">
                <strong>Scan Date</strong>
                {{ record["scan_date"] }}
            </div>

        </div>

        

    </div>

</div>

</body>
</html>
