<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scan History | PakVision AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/history.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<link rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}">


<script src="{{ url_for('static', filename='js/theme.js') }}"></script>


</head>

<body>

<div class="container">

    <!-- Top Bar -->

    <div class="topbar">

        <a href="/dashboard" class="back">
            <i class="fa-solid fa-arrow-left"></i>
            Back To Dashboard
        </a>

        <h1>Scan History</h1>

    </div>

    <!-- Main Layout -->

    <div class="history-content">

        <!-- Left Side -->

        <div class="left-panel">

            <div class="cards">

                <div class="card">
                    <i class="fa-solid fa-images"></i>
                    <h2>18</h2>
                    <p>Total Scans</p>
                </div>

                <div class="card">
                    <i class="fa-solid fa-user"></i>
                    <h2>18</h2>
                    <p>Players Detected</p>
                </div>

                <div class="card">
                    <i class="fa-solid fa-chart-line"></i>
                    <h2>98%</h2>
                    <p>Highest Accuracy</p>
                </div>

            </div>

        </div>

        <!-- Right Side -->

        <div class="right-panel">

           
            <div class="table-box">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            
                            <th>Player</th>
                            <th>Role</th>
                            <th>Accuracy</th>
                            <th>Date</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody>

{% for row in history %}

<tr>

    <td>{{ row["id"] }}</td>

    <td>{{ row["player_name"] }}</td>

    <td>{{ row["role"] }}</td>

    <td>{{ row["accuracy"] }}</td>

    <td>{{ row["scan_date"] }}</td>

    <td>

    <a href="/history/view/{{ row['id'] }}" class="view">
        <i class="fa-solid fa-eye"></i>
        View
    </a>

    <form action="/history/delete/{{ row['id'] }}"
          method="POST"
          style="display:inline;"
          onsubmit="return confirm('Are you sure you want to delete this scan?');">

        <button type="submit" class="delete">
            <i class="fa-solid fa-trash"></i>
            Delete
        </button>

    </form>

</td>











</tr>

{% endfor %}

</tbody> 
                         
                            


                </table>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/history.js') }}"></script>

</body>
</html>
